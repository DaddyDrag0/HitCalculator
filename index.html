<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Hit Calc</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="topbar">
      <h1>Border Calc</h1>
      <button id="resetBtn" class="reset-btn" type="button">Reset</button>
    </header>

    <section class="main-grid">
      <div class="card setup-card">
        <div class="section-title">Current stats</div>

        <div class="stats-grid">
          <label class="stat-field speed-field">
            <span>Roll Speed</span>
            <div class="input-wrap"><input id="rollSpeed" type="number" inputmode="decimal" min="0.01" step="any" value="100" /><b>%</b></div>
          </label>

          <label class="stat-field">
            <span>Speed Structure</span>
            <select id="speedStructure">
              <option value="0">Level 0 · ×1.000</option>
              <option value="1">Level 1 · ×1.071</option>
              <option value="2">Level 2 · ×1.143</option>
              <option value="3">Level 3 · ×1.214</option>
              <option value="4">Level 4 · ×1.286</option>
              <option value="5">Level 5 · ×1.357</option>
              <option value="6">Level 6 · ×1.429</option>
              <option value="7">Level 7 · ×1.500</option>
            </select>
          </label>

          <label class="stat-field platinum-field">
            <span>Platinum Luck</span>
            <div class="input-wrap"><input id="platinumLuck" type="number" inputmode="decimal" min="0" step="any" value="1" /><b>×</b></div>
          </label>
          <label class="stat-field crystal-field">
            <span>Crystal Luck</span>
            <div class="input-wrap"><input id="crystalLuck" type="number" inputmode="decimal" min="0" step="any" value="1" /><b>×</b></div>
          </label>
          <label class="stat-field ruby-field">
            <span>Ruby Luck</span>
            <div class="input-wrap"><input id="rubyLuck" type="number" inputmode="decimal" min="0" step="any" value="1" /><b>×</b></div>
          </label>
          <label class="stat-field galaxy-field">
            <span>Galaxy Luck</span>
            <div class="input-wrap"><input id="galaxyLuck" type="number" inputmode="decimal" min="0" step="any" value="1" /><b>×</b></div>
          </label>
        </div>

        <label class="check-row">
          <input id="timeStorm" type="checkbox" />
          <span><strong>Time Storm</strong></span>
        </label>

        <div class="divider"></div>

        <div class="section-title">Goal borders</div>
        <div class="border-tabs" aria-label="Goal borders">
          <button class="border-tab platinum active" type="button" data-border="Platinum" aria-pressed="true"><span class="border-dot"></span><strong>Platinum</strong><span class="checkmark">✓</span></button>
          <button class="border-tab crystal" type="button" data-border="Crystal" aria-pressed="false"><span class="border-dot"></span><strong>Crystal</strong><span class="checkmark">✓</span></button>
          <button class="border-tab ruby" type="button" data-border="Ruby" aria-pressed="false"><span class="border-dot"></span><strong>Ruby</strong><span class="checkmark">✓</span></button>
          <button class="border-tab galaxy" type="button" data-border="Galaxy" aria-pressed="false"><span class="border-dot"></span><strong>Galaxy</strong><span class="checkmark">✓</span></button>
        </div>
      </div>

      <aside class="card result-card">
        <div class="result-label">Selected target</div>
        <div id="selectedBorders" class="selected-borders"></div>

        <div class="primary-results">
          <div class="primary-stat"><span>Average rolls</span><strong id="averageRolls">100</strong></div>
          <div class="primary-stat"><span>Average time</span><strong id="averageTime">1m 40s</strong></div>
        </div>

        <div class="secondary-results">
          <div><span>Cards / second</span><strong id="cardsPerSecond">1</strong></div>
          <div><span>Rolls / hour</span><strong id="rollsPerHour">3.6K</strong></div>
        </div>
      </aside>
    </section>

    <section class="card time-card">
      <div class="time-head">
        <div class="section-title">Time span</div>
        <div class="time-controls">
          <div class="input-wrap time-value-wrap"><input id="timeValue" type="number" inputmode="decimal" min="0" step="any" value="1" /></div>
          <select id="timeUnit">
            <option value="second">Seconds</option>
            <option value="minute">Minutes</option>
            <option value="hour" selected>Hours</option>
            <option value="day">Days</option>
            <option value="week">Weeks</option>
          </select>
          <div class="span-rolls"><span>Rolls</span><strong id="timeRolls">3.6K</strong></div>
        </div>
      </div>

      <div id="borderChanceResults" class="chance-results"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
