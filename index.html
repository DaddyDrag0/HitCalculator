<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Border Calculator — Card RNG: Expansion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <div class="game-name">CARD RNG: EXPANSION</div>
        <h1>Border Calculator</h1>
        <p>Estimate the rolls and time needed to hit your selected border combination.</p>
      </div>
      <button id="resetBtn" class="reset-btn" type="button">Reset</button>
    </header>

    <section class="calculator">
      <div class="setup-card card">
        <div class="section-block">
          <div class="section-title">Borders you want</div>
          <div class="border-tabs" aria-label="Target borders">
            <button class="border-tab platinum active" type="button" data-border="Platinum" aria-pressed="true">
              <span class="border-dot"></span>
              <strong>Platinum</strong>
              <span class="checkmark">✓</span>
            </button>
            <button class="border-tab crystal" type="button" data-border="Crystal" aria-pressed="false">
              <span class="border-dot"></span>
              <strong>Crystal</strong>
              <span class="checkmark">✓</span>
            </button>
            <button class="border-tab ruby" type="button" data-border="Ruby" aria-pressed="false">
              <span class="border-dot"></span>
              <strong>Ruby</strong>
              <span class="checkmark">✓</span>
            </button>
            <button class="border-tab galaxy" type="button" data-border="Galaxy" aria-pressed="false">
              <span class="border-dot"></span>
              <strong>Galaxy</strong>
              <span class="checkmark">✓</span>
            </button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="section-block">
          <div class="section-title">Border luck</div>
          <div class="luck-grid">
            <label class="luck-field platinum-luck" data-luck-border="Platinum">
              <span>Platinum Luck</span>
              <div class="input-wrap"><input id="platinumLuck" type="number" inputmode="decimal" min="0" step="any" value="1" /><b>×</b></div>
            </label>
            <label class="luck-field crystal-luck" data-luck-border="Crystal">
              <span>Crystal Luck</span>
              <div class="input-wrap"><input id="crystalLuck" type="number" inputmode="decimal" min="0" step="any" value="1" /><b>×</b></div>
            </label>
            <label class="luck-field ruby-luck" data-luck-border="Ruby">
              <span>Ruby Luck</span>
              <div class="input-wrap"><input id="rubyLuck" type="number" inputmode="decimal" min="0" step="any" value="1" /><b>×</b></div>
            </label>
            <label class="luck-field galaxy-luck" data-luck-border="Galaxy">
              <span>Galaxy Luck</span>
              <div class="input-wrap"><input id="galaxyLuck" type="number" inputmode="decimal" min="0" step="any" value="1" /><b>×</b></div>
            </label>
          </div>
        </div>

        <div class="divider"></div>

        <label class="setting-field roll-speed-field">
          <span>Roll Speed</span>
          <div class="input-wrap"><input id="rollSpeed" type="number" inputmode="decimal" min="0.01" step="any" value="100" /><b>%</b></div>
        </label>
      </div>

      <div class="result-card card">
        <div class="result-top">
          <span class="result-label">Selected target</span>
          <div id="selectedBorders" class="selected-borders"></div>
        </div>

        <div class="primary-results">
          <div class="primary-stat">
            <span>Average rolls</span>
            <strong id="averageRolls">100</strong>
          </div>
          <div class="primary-stat">
            <span>Average time</span>
            <strong id="averageTime">2m 30s</strong>
          </div>
        </div>

        <div class="secondary-results">
          <div>
            <span>Roll interval</span>
            <strong id="rollInterval">1.5s</strong>
          </div>
          <div>
            <span>Rolls / hour</span>
            <strong id="rollsPerHour">2,400</strong>
          </div>
        </div>

        <div class="speed-note" id="speedNote"></div>
      </div>
    </section>

    <footer>Roll Speed currently uses 1.5s at 100%, with a 0.3s minimum.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
