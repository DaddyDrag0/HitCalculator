name: Validate Hit Calc relic upgrades
on:
  push:
    branches: [horseman-relic-level-effects-20261026]
    paths:
      - '.github/workflows/relic-upgrades-test-20261026.yml'
permissions:
  contents: read
jobs:
  relic-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Validate syntax and upgraded worker formulas
        run: |
          node --check relic-upgrades-v1.js
          node --check relic-planner.js
          node --check upgrade-v2.js
          node --check vicissitudes-v14.js
          node --check roll-simulator-v15.js
          node --check roll-sim-worker-v16.js
          node --check roll-sim-worker-v30.js
          node --check roll-sim-worker-v39.js
          node relic-upgrades-selftest.cjs
          node optimizer-v4-selftest.cjs
          node hit-calc-mutation-selftest.cjs
          node hit-calc-event-cleanup-selftest.cjs
