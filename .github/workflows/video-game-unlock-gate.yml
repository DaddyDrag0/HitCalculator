name: Enforce Video Game pack unlock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-game-unlock-gate.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add 25M roll gate and cache refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('roll-sim-video-game-v34.js')
          s=p.read_text()
          needle="  if (Array.isArray(DATA.currentEvents)) DATA.currentEvents.splice(0, DATA.currentEvents.length, ...currentEvents.map((card) => card.name));"
          repl="  for (const card of DATA.cards) if (card.pack === 'Video Game') card.rollRequirement = 25000000;\n"+needle
          if needle not in s: raise SystemExit('Video Game data insertion point missing')
          p.write_text(s.replace(needle,repl,1))

          p=Path('roll-sim-worker-v19.js')
          s=p.read_text()
          needle="  if (card?.rollable === false || card?.expiredEvent) return null;\n  if (card?.pack && Array.isArray(build?.enabledPacks) && !build.enabledPacks.includes(card.pack)) return null;"
          repl="  if (card?.rollable === false || card?.expiredEvent) return null;\n  if (card?.rollRequirement && (Number(build?.rolls) || 0) < Number(card.rollRequirement)) return null;\n  if (card?.pack && Array.isArray(build?.enabledPacks) && !build.enabledPacks.includes(card.pack)) return null;"
          if needle not in s: raise SystemExit('worker eligibility insertion point missing')
          p.write_text(s.replace(needle,repl,1))

          p=Path('roll-sim-pack-ui-v19.js')
          s=p.read_text()
          old="const ORDER = ['Anime', 'Egypt', 'Rising Sun', 'Immortal', 'Prehistoric', 'Cryptid', 'Era2'];"
          if old in s: s=s.replace(old,"const ORDER = ['Anime', 'Egypt', 'Rising Sun', 'Immortal', 'Prehistoric', 'Cryptid', 'Era2', 'Video Game'];",1)
          p.write_text(s)

          p=Path('roll-sim-pack-weather-v26.js')
          s=p.read_text()
          old="      const text = `${cards.length} cards${weather ? ` · ${weather} weather-only` : ''}`;"
          new="      const requirement = pack === 'Video Game' ? ' · 25M rolls' : '';\n      const text = `${cards.length} cards${weather ? ` · ${weather} weather-only` : ''}${requirement}`;"
          if old not in s: raise SystemExit('pack status insertion point missing')
          p.write_text(s.replace(old,new,1))

          p=Path('roll-sim-pack-loader-v20.js')
          s=p.read_text().replace('roll-sim-pack-ui-v19.js?rev=20260826-2248','roll-sim-pack-ui-v19.js?rev=20260907-video-game-2')
          p.write_text(s)

          p=Path('app.js')
          s=p.read_text()
          for old,new in [
            ('hit-calc-video-game-v34.js?rev=20260907-video-game-1','hit-calc-video-game-v34.js?rev=20260907-video-game-2'),
            ('roll-sim-video-game-v34.js?rev=20260907-video-game-1','roll-sim-video-game-v34.js?rev=20260907-video-game-2'),
            ('roll-sim-parallel-v19.js?rev=20260907-video-game-1','roll-sim-parallel-v19.js?rev=20260907-video-game-2'),
            ('roll-sim-pack-loader-v20.js?rev=20260826-2248','roll-sim-pack-loader-v20.js?rev=20260907-video-game-2'),
            ('roll-sim-pack-weather-v26.js?rev=20260826-2020','roll-sim-pack-weather-v26.js?rev=20260907-video-game-2'),
          ]: s=s.replace(old,new)
          p.write_text(s)

          p=Path('index-base.html')
          s=p.read_text().replace('app.js?v=20260822-1413','app.js?v=20260907-video-game-2')
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text().replace("const version='20260907-video-game-1';","const version='20260907-video-game-2';")
          p.write_text(s)
          PY
      - name: Validate unlock behavior
        run: |
          node --check roll-sim-video-game-v34.js
          node --check roll-sim-worker-v19.js
          node --check roll-sim-pack-ui-v19.js
          node --check roll-sim-pack-weather-v26.js
          node --check roll-sim-pack-loader-v20.js
          node --check app.js
          grep -q "rollRequirement = 25000000" roll-sim-video-game-v34.js
          grep -q "card?.rollRequirement" roll-sim-worker-v19.js
          grep -q "25M rolls" roll-sim-pack-weather-v26.js
          grep -q "app.js?v=20260907-video-game-2" index-base.html
      - name: Publish unlock fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/video-game-unlock-gate.yml
          git add -A
          git commit -m "Enforce Video Game pack 25M roll unlock"
          git pull --rebase origin main
          git push origin HEAD:main
