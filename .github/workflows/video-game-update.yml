name: Hit Calc Video Game update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-game-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add current event and Video Game pack data
        run: |
          cat > hit-calc-video-game-v34.js <<'JS'
          (() => {
            if (typeof CARD_POOL === 'undefined' || !Array.isArray(CARD_POOL)) return;
            const EVENT_END = 1789174800; // 2026-09-12 01:00 UTC
            const currentEvents = [
              { name: 'Fate Seamstress', rarity: 2000000000, expires: EVENT_END, rollFactor: 0.2 },
              { name: 'Supreme Ozzy', rarity: 411000000, expires: EVENT_END, rollFactor: 0.2 },
              { name: 'The Broken One', rarity: 400000000, expires: EVENT_END, rollFactor: 0.2 },
              { name: 'Hera', rarity: 38450000, expires: EVENT_END, rollFactor: 0.2 },
            ];
            const byName = new Map(CARD_POOL.map((card) => [card.name, card]));
            for (const source of currentEvents) {
              const current = byName.get(source.name);
              if (current) Object.assign(current, source);
              else { const card = { ...source }; CARD_POOL.push(card); byName.set(card.name, card); }
            }
            CARD_POOL.sort((a, b) => b.rarity - a.rarity || String(a.name).localeCompare(String(b.name)));
          })();
          JS

          cat > roll-sim-video-game-v34.js <<'JS'
          (() => {
            const DATA = globalThis.ROLL_SIM_DATA_V16;
            if (!DATA?.cards || !Array.isArray(DATA.cards)) return;
            const currentEvents = [
              { name: 'Fate Seamstress', rarity: 2000000000, currentEvent: true, eventFactor: 0.2 },
              { name: 'Supreme Ozzy', rarity: 411000000, currentEvent: true, eventFactor: 0.2 },
              { name: 'The Broken One', rarity: 400000000, currentEvent: true, eventFactor: 0.2 },
              { name: 'Hera', rarity: 38450000, currentEvent: true, eventFactor: 0.2 },
            ];
            const videoGame = [
              { name: 'Durante', rarity: 777777777, pack: 'Video Game' },
              { name: 'Heavenly Father', rarity: 100000000, pack: 'Video Game', weather: 'Rapture' },
              { name: 'Ice King', rarity: 55000000, pack: 'Video Game', weather: 'Snow' },
              { name: 'NO.2', rarity: 10000000, pack: 'Video Game' },
              { name: 'Necro-orc', rarity: 9000000, pack: 'Video Game', weather: 'Virus' },
              { name: 'Melanin', rarity: 6000000, pack: 'Video Game', weather: 'Armageddon' },
              { name: 'God-Slayer', rarity: 5000000, pack: 'Video Game', weather: 'Armageddon' },
              { name: 'Creed', rarity: 4500000, pack: 'Video Game' },
              { name: 'The Sack', rarity: 2500000, pack: 'Video Game' },
              { name: 'Hell killer', rarity: 1500000, pack: 'Video Game', weather: 'Blood Rain' },
              { name: 'Hollow', rarity: 500000, pack: 'Video Game', weather: 'Shroud' },
              { name: 'Steven', rarity: 80000, pack: 'Video Game' },
            ];
            const byName = new Map(DATA.cards.map((card) => [card.name, card]));
            for (const source of [...currentEvents, ...videoGame]) {
              const current = byName.get(source.name);
              if (current) Object.assign(current, source);
              else { const card = { ...source }; DATA.cards.push(card); byName.set(card.name, card); }
              const card = byName.get(source.name);
              if (source.currentEvent) {
                card.rollable = true;
                card.expiredEvent = false;
                if ('expiredBaseRarity' in card) delete card.expiredBaseRarity;
              }
            }
            if (Array.isArray(DATA.currentEvents)) DATA.currentEvents.splice(0, DATA.currentEvents.length, ...currentEvents.map((card) => card.name));
            DATA.cards.sort((a, b) => (Number(b.rarity) || 0) - (Number(a.rarity) || 0) || String(a.name).localeCompare(String(b.name)));
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text()
          s = s.replace(
              '<script src="./app-base.js?rev=20260826-2020"><\\/script>',
              '<script src="./app-base.js?rev=20260826-2020"><\\/script><script src="./hit-calc-video-game-v34.js?rev=20260907-video-game-1"><\\/script>',
              1,
          )
          s = s.replace(
              '<script src="./roll-sim-event-expiry-v32.js?rev=20260826-2020"><\\/script>',
              '<script src="./roll-sim-event-expiry-v32.js?rev=20260826-2020"><\\/script><script src="./roll-sim-video-game-v34.js?rev=20260907-video-game-1"><\\/script>',
              1,
          )
          s = s.replace('roll-sim-parallel-v19.js?rev=20260826-2020', 'roll-sim-parallel-v19.js?rev=20260907-video-game-1')
          p.write_text(s)

          p = Path('roll-sim-worker-v19.js')
          s = p.read_text()
          needle = "importScripts('./roll-sim-event-expiry-v32.js?rev=20260826-1648');"
          if needle not in s: raise SystemExit('worker event import not found')
          s = s.replace(needle, needle + "\nimportScripts('./roll-sim-video-game-v34.js?rev=20260907-video-game-1');", 1)
          p.write_text(s)

          p = Path('roll-sim-worker-v30.js')
          s = p.read_text().replace("roll-sim-worker-v19.js?rev=20260826-1648", "roll-sim-worker-v19.js?rev=20260907-video-game-1")
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text().replace("const version='20260829-optimizer15';", "const version='20260907-video-game-1';")
          p.write_text(s)
          PY
      - name: Validate updated pools
        run: |
          node --check hit-calc-video-game-v34.js
          node --check roll-sim-video-game-v34.js
          node --check app.js
          node --check roll-sim-worker-v19.js
          node --check roll-sim-worker-v30.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const ctx={window:{}};ctx.globalThis=ctx;vm.createContext(ctx);
          for(const file of ['roll-sim-data-v16.js','roll-sim-event-expiry-v32.js','roll-sim-video-game-v34.js']) vm.runInContext(fs.readFileSync(file,'utf8'),ctx,{filename:file});
          const d=ctx.ROLL_SIM_DATA_V16;
          assert.equal(d.cards.filter(c=>c.pack==='Video Game').length,12);
          assert.deepEqual(Array.from(d.currentEvents),['Fate Seamstress','Supreme Ozzy','The Broken One','Hera']);
          for(const name of d.currentEvents){const c=d.cards.find(c=>c.name===name);assert(c&&c.currentEvent&&c.rollable!==false&&c.rarity<Infinity,name)}
          assert.equal(d.cards.find(c=>c.name==='Eonus').rollable,false);
          assert.equal(d.cards.find(c=>c.name==='Eclipseborn Luminant').rollable,false);
          console.log('Hit Calc Video Game/event pools validated.');
          NODE
      - name: Publish Hit Calc update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/video-game-update.yml
          git add -A
          git commit -m "Add Video Game pack and current event cards"
          git pull --rebase origin main
          git push origin HEAD:main
