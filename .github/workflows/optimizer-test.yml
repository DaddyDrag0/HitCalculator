name: Optimizer Test

on:
  push:
    branches: [main, optimizer-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Hit Calc update
        run: |
          node --check app-base.js
          node --check upgrade-v2.js
          node --check upgrade-final-sync-v24.js
          node --check upgrade-target-sync-v27.js
          node --check optimizer-builds-v1.js
          node --check roll-simulator-v15.js
          node --check roll-sim-worker-v30.js
          node --check roll-sim-worker-v39.js
          node --check roll-sim-parallel-v19.js
          node hit-calc-mutation-selftest.cjs
      - name: Validate optimizer patches
        run: node optimizer-v4-selftest.cjs
