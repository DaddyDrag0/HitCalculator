name: Optimizer Test

on:
  push:
    branches: [main, optimizer-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate optimizer patches
        run: node optimizer-v4-selftest.cjs
