<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090b0f" />
  <title>Hit Calc - Fast Estimate Test</title>
  <style>html,body{margin:0;min-height:100%;background:#090b0f;color:#8d96a4;font-family:Inter,system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center}</style>
</head>
<body>
  <div class="boot">Loading Fast Estimate Test…</div>
  <script>
  (async()=>{
    const version='20260826-2020';
    try{
      const response=await fetch(`./index-base.html?rev=${version}`,{cache:'no-store'});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      let html=await response.text();
      html=html.replace(/styles\.css\?v=[^"']+/g,`styles.css?v=${version}&theme=lava1`);
      html=html.replace(/app\.js\?v=[^"']+/g,`app.js?v=${version}&theme=lava1`);
      html=html.replace(/const version = "[^"]+";/,`const version = "${version}";`);
      const bootstrap='<scr'+'ipt id="hit-calc-theme-bootstrap">(()=>{const valid=new Set([\'default\',\'scarlet\',\'slate\',\'lava\']);let theme=\'default\';try{const saved=localStorage.getItem(\'crx-site-theme\');if(valid.has(saved))theme=saved}catch{}document.documentElement.dataset.theme=theme})();</scr'+'ipt>\n';
      html=html.replace('  <link rel="stylesheet"',bootstrap+'  <link rel="stylesheet"');
      html=html.replace('</body>','<scr'+'ipt src="./fast-estimate-test-v1.js?rev=20260826-2148"></scr'+'ipt></body>');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      console.error(error);
      document.body.innerHTML='<div class="boot">Failed to load Fast Estimate Test. Refresh the page.</div>';
    }
  })();
  </script>
</body>
</html>
